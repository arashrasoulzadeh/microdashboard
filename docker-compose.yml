version: "3.9"
services:
  api:
    build: .
    ports: ["80:80", "443:443"]
    environment:
      - ADMIN_TOKEN=change_me
      - LETSENCRYPT_EMAIL=you@example.com
    volumes:
      - ./data:/etc/microdashboard/data
    depends_on:
      - mosquitto

  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]

